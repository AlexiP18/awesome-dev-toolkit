<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardando en Dev Toolkit...</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
  <div id="card" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md text-center shadow-2xl">
    <div id="spinner" class="w-10 h-10 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
    <h2 id="title" class="text-base font-bold text-slate-100 mb-1">⚡ Analizando con Gemini...</h2>
    <p id="subtitle" class="text-xs text-slate-400">Verificando duplicados y extrayendo herramientas</p>
    <div id="details" class="hidden mt-4 pt-3 border-t border-slate-800 text-left text-xs space-y-2 max-h-56 overflow-y-auto"></div>
  </div>

  <script>
    async function runQuickSave() {
      const params = new URLSearchParams(window.location.search);
      const sourceTweet = params.get('sourceTweet') || '';
      const rawText = params.get('rawText') || '';
      const author = params.get('author') || '';
      const urlParam = params.get('url') || '';
      const urls = urlParam ? urlParam.split(',').map(u => u.trim()).filter(Boolean) : [];
      const aiProvider = params.get('aiProvider') || localStorage.getItem('toolkit_selected_ai_provider') || undefined;

      const spinner = document.getElementById('spinner');
      const title = document.getElementById('title');
      const subtitle = document.getElementById('subtitle');
      const details = document.getElementById('details');

      if (aiProvider && title) {
        title.innerText = `⚡ Analizando con ${aiProvider}...`;
      }

      if (!sourceTweet && !rawText && urls.length === 0) {
        spinner.className = 'hidden';
        title.innerText = '⚠️ Sin datos para guardar';
        subtitle.innerText = 'No se detectó ningún enlace o texto.';
        return;
      }

      try {
        const res = await fetch('/api/ingest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sourceTweet: sourceTweet || undefined,
            rawText: rawText || undefined,
            author: author || undefined,
            urls: urls.length > 0 ? urls : undefined,
            aiProvider: aiProvider || undefined,
          }),
        });

        const data = await res.json();
        spinner.className = 'hidden';

        if (data.success) {
          const items = data.data?.items || (data.data?.classification ? [{ classification: data.data.classification, alreadyExisted: data.data.alreadyExisted }] : []);
          const addedCount = data.data?.addedCount ?? items.filter(i => !i.alreadyExisted).length;
          const skippedCount = data.data?.skippedCount ?? items.filter(i => i.alreadyExisted).length;

          if (items.length > 1) {
            if (addedCount === 0) {
              title.className = 'text-base font-bold text-amber-400 mb-1';
              title.innerText = `⏭️ Las ${skippedCount} herramientas ya existían`;
              subtitle.innerText = 'Ninguna se duplicó en tu catálogo:';
            } else if (skippedCount > 0) {
              title.className = 'text-base font-bold text-emerald-400 mb-1';
              title.innerText = `✅ ${addedCount} nueva(s) · ⏭️ ${skippedCount} omitida(s)`;
              subtitle.innerText = 'Se omitieron las que ya tenías guardadas:';
            } else {
              title.className = 'text-base font-bold text-emerald-400 mb-1';
              title.innerText = `✅ ¡${addedCount} herramientas guardadas!`;
              subtitle.innerText = 'Todas las herramientas del tweet fueron añadidas:';
            }

            details.classList.remove('hidden');
            details.innerHTML = items.map((item, idx) => {
              const info = item.classification || {};
              const badge = item.alreadyExisted
                ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300">⏭️ Ya existía</span>`
                : `<span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300">🆕 Nueva</span>`;
              return `
                <div class="p-2 rounded-lg bg-slate-950 border border-slate-800">
                  <div class="flex justify-between items-center gap-2">
                    <span class="font-bold text-slate-200 truncate">${idx + 1}. ${info.name || 'Herramienta'}</span>
                    <div class="flex items-center gap-1 flex-shrink-0">
                      ${badge}
                      <span class="text-[10px] px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-400">${info.category || 'Other'}</span>
                    </div>
                  </div>
                  <p class="text-[11px] text-slate-400 line-clamp-1 mt-0.5">${info.oneLiner || ''}</p>
                </div>
              `;
            }).join('') + `<p class="text-[10px] text-slate-500 text-center pt-2">Esta ventana se cerrará automáticamente...</p>`;

            setTimeout(() => {
              window.close();
            }, 3500);
          } else {
            const firstItem = items[0] || {};
            const info = firstItem.classification || {};

            if (firstItem.alreadyExisted) {
              title.className = 'text-base font-bold text-amber-400 mb-1';
              title.innerText = '⏭️ Ya estaba en tu Toolkit';
              subtitle.innerText = `${info.name || 'Esta herramienta'} ya existe (no se duplicó)`;
            } else {
              title.className = 'text-base font-bold text-emerald-400 mb-1';
              title.innerText = '✅ ¡Guardado con éxito!';
              subtitle.innerText = info.name || 'Herramienta añadida';
            }

            details.classList.remove('hidden');
            details.innerHTML = `
              <div><span class="text-slate-500">Categoría:</span> <span class="text-sky-400 font-medium">${info.category || 'Other'}</span></div>
              <div><span class="text-slate-500">Tags:</span> <span class="text-slate-300 font-mono">${(info.tags || []).map(t => '#' + t).join(' ')}</span></div>
              <p class="text-slate-400 pt-1 line-clamp-2">${info.oneLiner || ''}</p>
              <p class="text-[10px] text-slate-500 text-center pt-2">Esta ventana se cerrará automáticamente...</p>
            `;

            setTimeout(() => {
              window.close();
            }, 2200);
          }
        } else {
          title.className = 'text-base font-bold text-red-400 mb-1';
          title.innerText = '❌ Error al guardar';
          subtitle.innerText = data.error || 'Ocurrió un problema en el servidor';
        }
      } catch (err) {
        spinner.className = 'hidden';
        title.className = 'text-base font-bold text-red-400 mb-1';
        title.innerText = '❌ Error de conexión';
        subtitle.innerText = 'No se pudo contactar con el servidor.';
      }
    }

    runQuickSave();
  </script>
</body>
</html>
