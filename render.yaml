services:
  - type: web
    name: awesome-dev-toolkit
    runtime: node
    branch: main
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ZENMUX_DEEPSEEK_KEY
        sync: false
      - key: ZENMUX_CLAUDE_KEY
        sync: false
      - key: ZENMUX_MINIMAX_KEY
        sync: false
      - key: ZENMUX_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
